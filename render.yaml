# مواصفات Render Blueprint — رفع المشروع من Git إلى Render
# التوثيق: https://render.com/docs/blueprint-spec
#
# بعد الربط: Render ينشئ خدمة ويب، يبني الحزم، ويشغّل gunicorn على المنفذ $PORT

services:
  - type: web
    name: ipds-uba
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
