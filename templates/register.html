<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب — IPDS-UBA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="login-page">
        <section class="login-form-side">
            <div class="login-box">
                <h2>إنشاء حساب جديد</h2>
                {% if error %}
                <div class="alert-banner danger">{{ error }}</div>
                {% endif %}
                <form method="post" action="{{ url_for('auth.register_view') }}" class="form-stack">
                    <div>
                        <label for="username">اسم المستخدم</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div>
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div>
                        <label for="password">كلمة المرور</label>
                        <input type="password" id="password" name="password" required minlength="6">
                    </div>
                    <div>
                        <label for="password2">تأكيد كلمة المرور</label>
                        <input type="password" id="password2" name="password2" required minlength="6">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" style="width:100%;">تسجيل</button>
                    </div>
                </form>
                <p class="muted">لديك حساب بالفعل؟ <a href="{{ url_for('auth.login_view') }}">تسجيل الدخول</a></p>
            </div>
        </section>
        <section class="login-welcome">
            <h1>انضم إلى منصة IPDS-UBA</h1>
            <p>أنشئ حساباً لتتبع نشاطك الأمني والحصول على تحليلات سلوكية أثناء الاستخدام.</p>
            <ul>
                <li>تخزين آمن لبيانات الدخول (مشفّرة)</li>
                <li>سجل نشاطات مفصل</li>
                <li>ملف سلوكي يتعلم من عاداتك</li>
            </ul>
        </section>
    </div>
</body>
</html>
