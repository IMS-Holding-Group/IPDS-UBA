<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title or 'IPDS-UBA' }} — نظام كشف التصيد الذكي</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/font-awesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar" aria-label="القائمة الرئيسية">
        <div class="sidebar-logo">
            <h2>IPDS-UBA</h2>
            <span>نظام كشف التصيد الذكي</span>
        </div>
        <nav class="sidebar-nav">
            <a href="{{ url_for('dashboard.dashboard_view') }}" data-nav="/dashboard">
                <i class="fa-solid fa-chart-line nav-icon" aria-hidden="true"></i>
                <span>لوحة التحكم</span>
            </a>
            <a href="{{ url_for('activities.activities_view') }}" data-nav="/activities">
                <i class="fa-solid fa-list-ul nav-icon" aria-hidden="true"></i>
                <span>النشاطات</span>
            </a>
            <a href="{{ url_for('alerts.alerts_view') }}" data-nav="/alerts" class="sidebar-nav-row">
                <i class="fa-solid fa-triangle-exclamation nav-icon" aria-hidden="true"></i>
                <span>التنبيهات</span>
                <span class="badge badge-danger nav-alert-badge is-hidden" id="sidebarAlertBadge">0</span>
            </a>
            <a href="{{ url_for('dashboard.profile_view') }}" data-nav="/profile">
                <i class="fa-solid fa-user nav-icon" aria-hidden="true"></i>
                <span>الملف الشخصي</span>
            </a>
            <a href="{{ url_for('auth.logout_view') }}" data-nav="/logout">
                <i class="fa-solid fa-arrow-right-from-bracket nav-icon" aria-hidden="true"></i>
                <span>تسجيل الخروج</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div>المستخدم: <span id="sidebarUsername">{{ session.get('username','') }}</span></div>
        </div>
    </aside>
    <div class="main-content" id="mainContent">
        <header class="topbar">
            <div class="topbar-start">
                <button type="button" class="btn-nav-toggle" id="navToggle" aria-label="فتح القائمة" aria-expanded="false" aria-controls="sidebar">
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>
                <h1>{{ page_title or 'لوحة التحكم' }}</h1>
            </div>
            <div class="topbar-actions">
                <span class="badge badge-info topbar-notif" id="topbarNotif" title="تنبيهات نشطة">
                    <i class="fa-solid fa-bell" aria-hidden="true"></i>
                    <span id="topbarAlertCount">0</span>
                </span>
                <span class="topbar-user"><i class="fa-solid fa-user-circle" aria-hidden="true"></i> {{ session.get('username','') }}</span>
            </div>
        </header>
        {% block content %}{% endblock %}
    </div>
    <div class="toast-host" id="toastHost"></div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
